name: Build Windows Unified Installer (x64 & ARM64)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows-arm64:
    name: Build Windows ARM64 (Native)
    runs-on: windows-11-arm
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        continue-on-error: true
        id: flutter_setup
        with:
          channel: 'stable'
          cache: true

      - name: Manual Flutter Setup fallback
        if: steps.flutter_setup.outcome == 'failure'
        shell: pwsh
        run: |
          git clone -b stable https://github.com/flutter/flutter.git $HOME/flutter
          echo "$HOME/flutter/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Flutter & Environment
        shell: pwsh
        run: |
          flutter --version
          flutter doctor -v

      - name: Install 7-Zip
        shell: pwsh
        run: choco install 7zip -y --no-progress

      - name: Install Dependencies
        shell: pwsh
        run: flutter pub get

      - name: Build Windows ARM64 Release
        shell: pwsh
        run: flutter build windows --release

      - name: Stage ARM64 Release Files
        shell: pwsh
        run: |
          $sourceDir = "build\windows\arm64\runner\Release"
          if (-not (Test-Path $sourceDir)) {
            if (Test-Path "build\windows\runner\Release") {
              $sourceDir = "build\windows\runner\Release"
            }
          }
          Write-Host "Found ARM64 Release at: $sourceDir"
          if (-not (Test-Path "$sourceDir\plix.exe")) {
            Write-Error "plix.exe not found in $sourceDir"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path "build\staged\arm64" | Out-Null
          Copy-Item "$sourceDir\*" -Destination "build\staged\arm64" -Recurse -Force
          Write-Host "Staged ARM64 files successfully"

      - name: Upload ARM64 Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plix_windows_arm64_release
          path: build/staged/arm64/
          if-no-files-found: error
          retention-days: 14

  build-windows-x64:
    name: Build Windows x64 (Native)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter
        shell: pwsh
        run: |
          flutter --version

      - name: Install Dependencies
        shell: pwsh
        run: flutter pub get

      - name: Build Windows x64 Release
        shell: pwsh
        run: flutter build windows --release

      - name: Stage x64 Release Files
        shell: pwsh
        run: |
          $sourceDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path $sourceDir)) {
            if (Test-Path "build\windows\runner\Release") {
              $sourceDir = "build\windows\runner\Release"
            }
          }
          Write-Host "Found x64 Release at: $sourceDir"
          if (-not (Test-Path "$sourceDir\plix.exe")) {
            Write-Error "plix.exe not found in $sourceDir"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path "build\staged\x64" | Out-Null
          Copy-Item "$sourceDir\*" -Destination "build\staged\x64" -Recurse -Force
          Write-Host "Staged x64 files successfully"

      - name: Upload x64 Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plix_windows_x64_release
          path: build/staged/x64/
          if-no-files-found: error
          retention-days: 14

  package-unified-installer:
    name: Package Unified Installer (x64 & ARM64)
    needs: [build-windows-arm64, build-windows-x64]
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Download ARM64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: plix_windows_arm64_release
          path: build/windows/arm64/runner/Release

      - name: Download x64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: plix_windows_x64_release
          path: build/windows/x64/runner/Release

      - name: Verify Staged Architectures
        shell: pwsh
        run: |
          Write-Host "Checking ARM64 release files:"
          Get-ChildItem -Path "build\windows\arm64\runner\Release" | Select-Object Name, Length
          Write-Host "Checking x64 release files:"
          Get-ChildItem -Path "build\windows\x64\runner\Release" | Select-Object Name, Length

          if (-not (Test-Path "build\windows\arm64\runner\Release\plix.exe")) {
            Write-Error "ARM64 plix.exe missing!"
            exit 1
          }
          if (-not (Test-Path "build\windows\x64\runner\Release\plix.exe")) {
            Write-Error "x64 plix.exe missing!"
            exit 1
          }

      - name: Compile Unified Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          Write-Host "Using ISCC compiler at: $iscc"

          $appVer = "1.5.2"
          if ($env:GITHUB_REF_NAME -match '^v?([0-9]+\.[0-9]+\.[0-9]+)') {
            $appVer = $Matches[1]
          }
          & $iscc /DMyAppVersion=$appVer /DMyAppOutputBaseFilename=plix_windows windows_installer.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ISCC compilation failed with code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          if (-not (Test-Path "build\installer\plix_windows.exe")) {
            Write-Error "Unified installer plix_windows.exe was not created"
            exit 1
          }
          $size = (Get-Item "build\installer\plix_windows.exe").Length
          Write-Host "Successfully generated unified installer plix_windows.exe ($size bytes)"

      - name: Upload Unified Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plix_windows_installer
          path: build/installer/plix_windows.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          files: build/installer/plix_windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
