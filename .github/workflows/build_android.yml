name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Stage APK Files
        run: |
          mkdir -p build/staged_apk
          cp build/app/outputs/flutter-apk/app-release.apk build/staged_apk/plix_android.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/staged_apk/plix_android_tv.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plix_android_apk
          path: build/staged_apk/
          if-no-files-found: error
          retention-days: 14

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          files: |
            build/staged_apk/plix_android.apk
            build/staged_apk/plix_android_tv.apk
            web_site/plix.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
