name: Build Windows ARM64 Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows-arm64:
    name: Build Windows ARM64
    runs-on: windows-11-arm
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        continue-on-error: true
        id: flutter_setup
        with:
          channel: 'stable'
          cache: true

      - name: Manual Flutter Setup fallback
        if: steps.flutter_setup.outcome == 'failure'
        shell: pwsh
        run: |
          git clone -b stable https://github.com/flutter/flutter.git $HOME/flutter
          echo "$HOME/flutter/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Flutter & Environment
        shell: pwsh
        run: |
          flutter --version
          flutter doctor -v

      - name: Install Inno Setup
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup -e --silent --accept-source-agreements --accept-package-agreements
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") -and -not (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y
          }

      - name: Install Dependencies
        shell: pwsh
        run: flutter pub get

      - name: Build Windows ARM64 Release
        shell: pwsh
        run: flutter build windows --release

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          Write-Host "Using ISCC compiler at: $iscc"

          $sourceDir = "build\windows\arm64\runner\Release"
          if (-not (Test-Path $sourceDir)) {
            if (Test-Path "build\windows\runner\Release") {
              $sourceDir = "build\windows\runner\Release"
            }
          }
          Write-Host "Using Release source dir: $sourceDir"

          & $iscc /DMyAppVersion=1.3.2 /DMyAppArch=arm64 /DMyAppSourceDir="$sourceDir" /DMyAppOutputBaseFilename="plix_windows_arm64" windows_installer.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ISCC compilation failed with code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          if (-not (Test-Path "build\installer\plix_windows_arm64.exe")) {
            Write-Error "Installer plix_windows_arm64.exe was not created"
            exit 1
          }
          Write-Host "Successfully generated build\installer\plix_windows_arm64.exe"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plix_windows_arm64
          path: build/installer/plix_windows_arm64.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload to Release (if tagged or main)
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.3.2
          files: build/installer/plix_windows_arm64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
