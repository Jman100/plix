name: Build Linux Packages (DEB, Arch Linux, Portable)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libmpv-dev \
            mpv \
            libepoxy-dev \
            dpkg-dev \
            zstd

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux Bundle (Release)
        run: flutter build linux --release

      - name: Package DEB Installer
        run: bash scripts/build_deb.sh 1.5.1

      - name: Package Arch Linux & Portable Tarball
        run: bash scripts/build_arch.sh 1.5.1

      - name: Upload Arch Linux Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plix_linux_arch
          path: build/staged_linux/plix-1.5.1-1-x86_64.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux Portable Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plix_linux_tarball
          path: build/staged_linux/plix-1.5.1-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plix_linux_deb
          path: build/staged_linux/plix_linux.deb
          if-no-files-found: error
          retention-days: 14

      # Publishing disabled for test build per user instructions: "don't publish yet"
      - name: Upload to GitHub Release (Disabled for test build)
        if: false
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/staged_linux/plix-1.5.1-1-x86_64.pkg.tar.zst
            build/staged_linux/plix-1.5.1-linux-x86_64.tar.gz
            build/staged_linux/plix_linux.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-arch-compatibility:
    name: Verify Arch Linux Compatibility & Direct Play Libs
    needs: build-linux
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Download Arch Package Artifact
        uses: actions/download-artifact@v4
        with:
          name: plix_linux_arch
          path: ./arch_pkg

      - name: Install Arch Runtime Dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm gtk3 mpv libepoxy hicolor-icon-theme binutils

      - name: Install Plix Arch Package via pacman
        run: |
          echo "=== Testing pacman -U installation of Plix ==="
          pacman -U --noconfirm ./arch_pkg/plix-1.5.1-1-x86_64.pkg.tar.zst

      - name: Verify Binary and Shared Library Resolution (ldd)
        run: |
          echo "=== Checking Installed Files ==="
          ls -la /usr/bin/plix
          ls -la /usr/lib/plix/
          ls -la /usr/share/applications/plix.desktop
          ls -la /usr/share/pixmaps/plix.png

          echo "=== Verifying Plix Executable Dynamic Linking ==="
          ldd /usr/lib/plix/plix
          if ldd /usr/lib/plix/plix | grep -i "not found"; then
            echo "ERROR: Missing libraries found in plix binary!"
            exit 1
          fi

          echo "=== Verifying media_kit Video Plugin Linking ==="
          LD_LIBRARY_PATH=/usr/lib/plix/lib ldd /usr/lib/plix/lib/libmedia_kit_video_plugin.so
          if LD_LIBRARY_PATH=/usr/lib/plix/lib ldd /usr/lib/plix/lib/libmedia_kit_video_plugin.so | grep -i "not found"; then
            echo "ERROR: Missing libraries found in media_kit video plugin!"
            exit 1
          fi

          echo "=== Verifying libmpv Direct Play Provider on Arch Linux ==="
          ls -l /usr/lib/libmpv.so*
          mpv --version

          echo "SUCCESS: Arch Linux compatibility verified. All Direct Play and GUI libraries resolve cleanly!"
