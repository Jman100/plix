name: Build iOS & iPadOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: xcode-27
    permissions:
      contents: write
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Select Xcode 27.1
        run: |
          if [ -d "/Applications/Xcode_27.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app
          elif [ -d "/Applications/Xcode_27.app" ]; then
            sudo xcode-select -s /Applications/Xcode_27.app
          fi
          xcodebuild -version

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r plix_ios.ipa Payload
          ls -lh plix_ios.ipa

      - name: Upload IPA Artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: plix_ios_unsigned
          path: build/ios/iphoneos/plix_ios.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Upload to Release
        if: always() && hashFiles('build/ios/iphoneos/plix_ios.ipa') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.10.5' }}
          files: build/ios/iphoneos/plix_ios.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
