name: Build iOS & iPadOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r plix_ios.ipa Payload
          ls -lh plix_ios.ipa

      - name: Upload IPA Artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: plix_ios_unsigned
          path: build/ios/iphoneos/plix_ios.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Upload to Release (if tagged)
        if: always() && startsWith(github.ref, 'refs/tags/v') && hashFiles('build/ios/iphoneos/plix_ios.ipa') != ''
        uses: softprops/action-gh-release@v2
        with:
          files: build/ios/iphoneos/plix_ios.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
