name: Sync Release Manifest Checksums

on:
  release:
    types: [published, edited]
  workflow_run:
    workflows: ["Build Android APK", "Build Windows Unified Installer (x64 & ARM64)", "Build Linux Packages (DEB, Arch Linux, Portable)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g. v1.9.2)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sync:
    name: Verify & Sync Release Checksums
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync Checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name || '' }}"
          python scripts/sync_release_checksums.py "$TAG" --commit
